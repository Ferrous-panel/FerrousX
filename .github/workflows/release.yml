name: Release Binary Assets

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build Release Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: ferrousx-linux-x86_64.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: ferrousx-linux-musl-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: ferrousx-linux-aarch64.tar.gz

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Build Dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools pkg-config libssl-dev clang llvm

      - name: Compile Release Binaries
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Package Release Tarball
        run: |
          mkdir -p release-pkg/bin release-pkg/conf release-pkg/scripts
          cp target/${{ matrix.target }}/release/ferrousx-bin release-pkg/bin/
          cp conf/ferrousx.toml release-pkg/conf/ 2>/dev/null || true
          cp scripts/install.sh release-pkg/scripts/ 2>/dev/null || true
          cp scripts/ferrousx.service release-pkg/scripts/ 2>/dev/null || true
          cp README.md LICENSE release-pkg/
          tar -czvf ${{ matrix.artifact_name }} -C release-pkg .

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

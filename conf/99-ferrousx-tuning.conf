# ==============================================================================
# /etc/sysctl.d/99-ferrousx-tuning.conf
# Thông số tối ưu hóa nhân Linux cho Web Server & Reverse Proxy FerrousX
# Áp dụng tức thì: sudo sysctl --system
# ==============================================================================

# 1. Quản lý File Descriptor và kết nối tối đa
fs.file-max = 2097152
fs.nr_open = 2097152
net.core.somaxconn = 65535
net.core.netdev_max_backlog = 65535
net.ipv4.tcp_max_syn_backlog = 65535

# 2. Thuật toán điều khiển tắc nghẽn BBRv3 và QoS FQ
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_ecn = 1

# 3. Tối ưu hóa thu hồi socket TCP và độ trễ
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_notsent_lowat = 16384

# 4. Siêu hàng đệm UDP QUIC (HTTP/3) và GRO/GSO (128 MB)
net.core.rmem_max = 134217728
net.core.wmem_max = 134217728
net.core.rmem_default = 33554432
net.core.wmem_default = 33554432
net.ipv4.udp_rmem_min = 32768
net.ipv4.udp_wmem_min = 32768

# 5. Bộ nhớ ảo và hoán trang (Swappiness)
vm.swappiness = 1
vm.vfs_cache_pressure = 50
vm.dirty_ratio = 10
vm.dirty_background_ratio = 3

# 6. Bảo mật & Chống DDoS cơ bản tầng mạng
net.ipv4.tcp_syncookies = 1
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.core.bpf_jit_harden = 2

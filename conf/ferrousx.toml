# /etc/ferrousx/ferrousx.toml
# ==============================================================================
# FerrousX — Cấu Hình Web Server & Reverse Proxy Production
# Tương thích đồng thời:
#   - TCP HTTP/1.1 (:80)
#   - TCP HTTPS TLS 1.3/1.2 ALPN h2,http/1.1 (:443) — Chuẩn Cloudflare Proxy Full
#   - UDP HTTP/3 QUIC (:443) + quảng bá Alt-Svc
#   - Đồng bộ động `/etc/ferrous-panel/admin.json` & `/www/server/panel/vhost/ferrousx/*.conf`
# ==============================================================================

version_epoch = 1
worker_threads = 0                  # 0 = Tự động ghim 1 Worker trên mỗi CPU Core
bind_http_addr = "0.0.0.0:80"       # Cổng TCP HTTP/1.1 (:80)
bind_https_addr = "0.0.0.0:443"     # Cổng TCP HTTPS TLS 1.3/1.2 ALPN h2,http/1.1 (:443)
bind_udp_addr = "0.0.0.0:443"       # Cổng UDP HTTP/3 QUIC (:443)
panel_control_socket = "/run/ferrousx/panel-admin.sock"
panel_admin_json_path = "/etc/ferrous-panel/admin.json"
vhost_conf_dir = "/www/server/panel/vhost/ferrousx"
phpmyadmin_upstream = "127.0.0.1:888"

uring_entries = 4096
sqpoll_idle_ms = 2000
arena_capacity_bytes = 65536
alt_svc_max_age = 86400

# --- THÔNG SỐ BẢO VỆ ỔN ĐỊNH HỆ THỐNG (STABILITY & ANTI-CRASH SHIELD) ---
client_max_body_size = 104857600    # Giới hạn 100MB upload
client_header_timeout_ms = 5000     # 5s timeout header (chống Slowloris)
client_body_timeout_ms = 15000      # 15s timeout body
proxy_connect_timeout_ms = 3000     # 3s timeout kết nối upstream
proxy_read_timeout_ms = 60000       # 60s timeout phản hồi upstream
circuit_breaker_max_fails = 5
circuit_breaker_cooldown_ms = 5000

[tls]
cert_chain_path = "/etc/ferrousx/ssl/fullchain.pem"
private_key_path = "/etc/ferrousx/ssl/privkey.pem"
enable_zero_rtt = true
alpn_protocols = ["h3", "h2", "http/1.1"]
quic_max_idle_timeout_ms = 30000
quic_initial_mtu = 1350

# ==============================================================================
# VIRTUAL HOST MẶC ĐỊNH (CATCH-ALL CHO MỌI DOMAIN / IP TRỎ VỀ SERVER)
# Các website riêng tạo từ Ferrous Panel sẽ tự động nạp từ:
#   /www/server/panel/vhost/ferrousx/*.conf
# ==============================================================================
[[vhosts]]
server_name = "_"
aliases = []
root_dir = "/www/wwwroot/default"
enable_http3_alt_svc = true
try_files = ["$uri", "$uri/", "/index.php?$query_string"]
index_files = ["index.php", "index.html", "index.htm"]

[vhosts.compression]
enable_zstd = true
enable_brotli = true
min_length_bytes = 1024

